# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name immich.xiya.live;
    return 301 https://$host$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name immich.xiya.live;

    ssl_certificate /etc/ssl/xiya.live/fullchain.pem;
    ssl_certificate_key /etc/ssl/xiya.live/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:12020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<style>img[alt="Immich logo"]{content:url("https://stella.xiya.live/avatar.png");border-radius:50%;object-fit:cover}img[alt="Immich logo"].h-12{width:48px}</style></head>';
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
