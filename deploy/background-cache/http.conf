# Include once inside http {}, never in a server/location.
# Nginx's cache manager enforces max_size asynchronously (not a disk quota).
proxy_cache_path /var/cache/nginx/stella-homebg levels=1:2
    keys_zone=stella_homebg:1m max_size=128m inactive=60s use_temp_path=off;

# Raw URI allowlist: a single existing public image/video filename only.
# Queries, encoded/traversal paths and nested/private endpoints bypass cache.
map $request_uri $stella_bg_skip_uri {
    default 1;
    "~^/assets/homebg/(?!.*\.\.)[A-Za-z0-9][A-Za-z0-9_.-]*\.(mp4|webm|mov|m4v|jpg|jpeg|png|webp|gif|avif|bmp)$" 0;
}
map $host $stella_bg_skip_host {
    default 1;
    stella.xiya.live 0;
}
map $upstream_http_content_type $stella_bg_skip_type {
    default 1;
    "~^image/" 0;
    "~^video/" 0;
}
# Explicit origin TTL can otherwise make non-200 replies cacheable too.
map $upstream_status $stella_bg_skip_status {
    default 1;
    200 0;
    304 0; # Revalidation of an already complete cached 200, not a new body.
}
# Origin Cache-Control/Expires/X-Accel-Expires retain native precedence.
# No ignore_headers: private/no-store/Set-Cookie remain native cache vetoes.
