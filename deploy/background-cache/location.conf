# Include ONLY in the existing exact stella.xiya.live TLS server.
# Compare forwarding/security policy with the real vhost before installation.
location ^~ /assets/homebg/ {
    proxy_pass http://127.0.0.1:12031;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    # Fetch/cache the full 200; nginx handles client Range/If-Range and HEAD.
    proxy_set_header Range "";
    proxy_set_header If-Range "";
    proxy_force_ranges on;
    proxy_buffering on;
    proxy_intercept_errors off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;

    proxy_cache stella_homebg;
    proxy_cache_key "$scheme|$host|$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_convert_head on;
    # Fallback only: explicit origin TTL (currently public 7d) takes precedence.
    proxy_cache_valid 200 1s;
    proxy_cache_revalidate on;
    proxy_cache_use_stale off;
    proxy_cache_background_update off;
    proxy_cache_lock on;
    proxy_cache_bypass $stella_bg_skip_uri $stella_bg_skip_host $http_authorization;
    proxy_no_cache $stella_bg_skip_uri $stella_bg_skip_host $http_authorization
        $stella_bg_skip_type $stella_bg_skip_status;
    # Do not add_header here: retain server/http security-header inheritance.
}
