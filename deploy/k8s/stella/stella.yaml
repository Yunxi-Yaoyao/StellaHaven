# Stella 应用部署 — stella-local（上海双pod）+ stella-us（美西）
---
# 上海：2 副本（Nyarch + NAS 各一），连主库端点 pg-rw
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stella-local
  namespace: stella
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stella-local
  template:
    metadata:
      labels:
        app: stella-local
    spec:
      affinity:
        # 两个副本强制分散到不同节点
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: stella-local
              topologyKey: kubernetes.io/hostname
        # 只调度到上海两个节点（不去美西）
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["yaoyao-y7p", "yaoyao-nas"]
      initContainers:
        - name: migrate
          image: gitlab-registry.xiya.live/yaoyao/stellahaven:latest
          command: ["/app/.venv/bin/alembic", "upgrade", "head"]
          env:
            - &pg-host {name: POSTGRES_HOST, value: "pg-rw.stella.svc.cluster.local"}
            - &pg-port {name: POSTGRES_PORT, value: "5432"}
            - &pg-user {name: POSTGRES_USER, value: "stalla"}
            - &pg-db {name: POSTGRES_DB, value: "stella"}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: pg-credentials, key: app-password}
      containers:
        - name: stella
          image: gitlab-registry.xiya.live/yaoyao/stellahaven:latest
          env:
            - *pg-host
            - *pg-port
            - *pg-user
            - *pg-db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: pg-credentials, key: app-password}
          ports:
            - containerPort: 12031
          readinessProbe:
            tcpSocket:
              port: 12031
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "768Mi"
---
# 上海的 Service（frp 健康检查组的后端）
apiVersion: v1
kind: Service
metadata:
  name: stella-local
  namespace: stella
spec:
  type: NodePort
  selector:
    app: stella-local
  ports:
    - port: 12031
      targetPort: 12031
      nodePort: 31031
---
# 美西：1 副本（RackNerd），读本地副本+写回主库
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stella-us
  namespace: stella
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stella-us
  template:
    metadata:
      labels:
        app: stella-us
    spec:
      nodeSelector:
        kubernetes.io/hostname: racknerd-b436b54
      containers:
        - name: stella
          image: gitlab-registry.xiya.live/yaoyao/stellahaven:latest
          env:
            - name: POSTGRES_HOST
              value: "pg-ro.stella.svc.cluster.local"   # 读本地副本
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "stalla"
            - name: POSTGRES_DB
              value: "stella"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: app-password
          ports:
            - containerPort: 12031
          readinessProbe:
            httpGet:
              path: /api/health
              port: 12031
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "768Mi"
---
# 美西的 Ingress（traefik 在 443 接）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stella-us
  namespace: stella
spec:
  rules:
    - host: stella-us.xiya.live
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stella-us
                port:
                  number: 12031
---
apiVersion: v1
kind: Service
metadata:
  name: stella-us
  namespace: stella
spec:
  selector:
    app: stella-us
  ports:
    - port: 12031
      targetPort: 12031
