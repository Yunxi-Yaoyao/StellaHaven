# Stella CI/CD — 全自动流水线
# test（双job并行）→ build（烤镜像推Registry）→ deploy（滚k3s）

stages:
  - test
  - build
  - deploy

variables:
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
  PIP_DEFAULT_TIMEOUT: "30"
  UV_HTTP_TIMEOUT: "30"
  UV_HTTP_RETRIES: "2"
  npm_config_registry: "https://registry.npmmirror.com"
  npm_config_fetch_timeout: "30000"
  npm_config_fetch_retries: "2"
  npm_config_audit: "false"
  npm_config_fund: "false"

backend-test:
  timeout: 15m
  stage: test
  image: python:3.13
  services:
    - postgres:18
  variables:
    POSTGRES_USER: stalla
    POSTGRES_PASSWORD: St@106954021
    POSTGRES_DB: stella
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  before_script:
    - pip install uv -q
  script:
    - uv sync --all-groups
    - uv run python deploy/ci/create-test-db.py
    - uv run pytest -q

frontend-build:
  timeout: 15m
  stage: test
  image: node:22
  cache:
    key: frontend-npm
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci --include=dev --prefer-offline
    - npm run build

# 烤镜像：两个镜像都打 commit SHA 标签 + latest
build-images:
  timeout: 15m
  stage: build
  image: docker:27
  needs: ["backend-test", "frontend-build"]   # 测试绿了才烤
  variables:
    REGISTRY: gitlab-registry.xiya.live/yaoyao/stellahaven
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login gitlab-registry.xiya.live -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --network=host -t $REGISTRY:$CI_COMMIT_SHORT_SHA -t $REGISTRY:latest .
    - docker build --network=host -f Dockerfile.pg -t $REGISTRY/pg-patroni:$CI_COMMIT_SHORT_SHA -t $REGISTRY/pg-patroni:latest .
    - docker push $REGISTRY:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY:latest
    - docker push $REGISTRY/pg-patroni:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY/pg-patroni:latest

# 部署：滚动更新 k3s（镜像标签=commit SHA，精确到这次提交）
deploy-k3s:
  timeout: 15m
  stage: deploy
  image:
    name: alpine/kubectl:1.35.0
    entrypoint: [""]      # 镜像 ENTRYPOINT 是 kubectl 本体，必须清空否则 shell 命令被当 kubectl 参数
  needs: ["build-images"]
  environment:
    name: production
  script:
    - kubectl rollout status deployment/pg-nyarch -n stella --timeout=60s || true
    - kubectl set image deployment/stella-local stella=gitlab-registry.xiya.live/yaoyao/stellahaven:$CI_COMMIT_SHORT_SHA -n stella
    - kubectl set image deployment/stella-us stella=gitlab-registry.xiya.live/yaoyao/stellahaven:$CI_COMMIT_SHORT_SHA -n stella
    - kubectl rollout status deployment/stella-local -n stella --timeout=180s
    - kubectl rollout status deployment/stella-us -n stella --timeout=180s
    - echo "🎉 deployed $CI_COMMIT_SHORT_SHA"
