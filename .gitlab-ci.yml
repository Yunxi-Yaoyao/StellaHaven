workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
    when: never
  - if: $CI_COMMIT_BRANCH
  - when: never
stages:
- test
- build
- deploy
variables:
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  PIP_DEFAULT_TIMEOUT: '30'
  UV_HTTP_TIMEOUT: '30'
  UV_HTTP_RETRIES: '2'
  npm_config_registry: https://registry.npmmirror.com
  npm_config_fetch_timeout: '30000'
  npm_config_fetch_retries: '2'
  npm_config_audit: 'false'
  npm_config_fund: 'false'
.validation-secret-boundary:
  before_script:
  - "if [ -n \"${STELLA_PRODUCTION_SSH_KEY:-}${STELLA_PRODUCTION_INVENTORY:-}${STELLA_PRODUCTION_KNOWN_HOSTS:-}${KUBECONFIG:-}${KUBE_CONFIG:-}${LOCAL_HA_SSH_CONFIG:-}${LOCAL_HA_INVENTORY:-}${STELLA_SECRET_KEY:-}${DATABASE_URL:-}\"\
    \ ]; then\n  printf '%s\\n' 'Deployment credentials must not enter validation/build jobs' >&2\n  exit 1\nfi\n"
.branch-validation:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH
  - when: never
backend-test:
  extends: .branch-validation
  parallel: 7
  timeout: 25m
  stage: test
  image: gitlab-registry.xiya.live/yaoyao/stellahaven/ci-base/python@sha256:25e2514972115ba1714069a3facf805a8ec789bf9f896c959465dc8df6501651
  services:
  - name: gitlab-registry.xiya.live/yaoyao/stellahaven/ci-base/postgres@sha256:885953109528ad3dfc90362b1a6f50a78620b5315be19f187753d267e484dc5b
    alias: postgres
  variables:
    STELLA_CI_NONCE_PG: '1'
    POSTGRES_USER: stalla
    POSTGRES_PASSWORD: isolated-ci-only-password
    POSTGRES_DB: stella
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    STELLA_COOKIE_SECURE: 'false'
    STELLA_MAIN_ORIGIN: http://testserver
    STELLA_TRUSTED_ORIGINS: http://testserver
    TMPDIR: /root/stella-ci-tmp
  before_script:
  - "if [ -n \"${STELLA_PRODUCTION_SSH_KEY:-}${STELLA_PRODUCTION_INVENTORY:-}${STELLA_PRODUCTION_KNOWN_HOSTS:-}${KUBECONFIG:-}${KUBE_CONFIG:-}${LOCAL_HA_SSH_CONFIG:-}${LOCAL_HA_INVENTORY:-}${STELLA_SECRET_KEY:-}${DATABASE_URL:-}\"\
    \ ]; then\n  printf '%s\\n' 'Deployment credentials must not enter validation/build jobs' >&2\n  exit 1\nfi\n"
  - mkdir -p "$TMPDIR" && chmod 700 "$TMPDIR"
  - python3 deploy/ci/runner-isolation/backend_dependencies.py backend
  - pip install uv -q
  - . deploy/ci/runner-isolation/prepare-backend-browser.sh
  script:
  - uv export --frozen --all-groups --no-emit-project -o /tmp/ci-requirements.txt
  - uv venv
  - uv pip sync --index-url "$PIP_INDEX_URL" --require-hashes /tmp/ci-requirements.txt
  - .venv/bin/python deploy/ci/create-test-db.py
  - .venv/bin/python deploy/ci/run-backend-shard.py
  artifacts:
    when: always
    expire_in: 30 days
    paths:
    - .ci-owned-evidence/
  tags:
  - stella-isolated-test
  cache: []
frontend-build:
  extends: .branch-validation
  timeout: 15m
  stage: test
  image: gitlab-registry.xiya.live/yaoyao/stellahaven/ci-base/node@sha256:c4d5523090a817b7aa86d2111241fdd4f66d1e27782b44160e6aa63b357ecb2d
  variables:
    CHROME_BIN: /usr/bin/chromium
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
  before_script:
  - "if [ -n \"${STELLA_PRODUCTION_SSH_KEY:-}${STELLA_PRODUCTION_INVENTORY:-}${STELLA_PRODUCTION_KNOWN_HOSTS:-}${KUBECONFIG:-}${KUBE_CONFIG:-}${LOCAL_HA_SSH_CONFIG:-}${LOCAL_HA_INVENTORY:-}${STELLA_SECRET_KEY:-}${DATABASE_URL:-}\"\
    \ ]; then\n  printf '%s\\n' 'Deployment credentials must not enter validation/build jobs' >&2\n  exit 1\nfi\n"
  - python3 deploy/ci/runner-isolation/browser_dependencies.py frontend
  cache: []
  script:
  - cd frontend
  - npm ci --ignore-scripts --include=dev --prefer-offline
  - npm test
  - node node_modules/vitest/vitest.mjs run --config vitest.website-key.config.mjs
  - node node_modules/vitest/vitest.mjs run --config vitest.settings.config.mjs
  - node node_modules/vitest/vitest.mjs run --config vitest.auth-provider.config.mjs
  - node node_modules/vitest/vitest.mjs run --config vitest.shell.config.mjs
  - node node_modules/vitest/vitest.mjs run --config vitest.hardware.config.mjs
  - node node_modules/vitest/vitest.mjs run --config vitest.overview.config.mjs
  - node node_modules/vitest/vitest.mjs run --config vitest.time-range.config.mjs
  - npm run test:monitor-loading
  - CHROME_PATH="$CHROME_BIN" OVERVIEW_EVIDENCE_DIR="$CI_PROJECT_DIR/frontend/node_modules/.cache/overview" node tests/overview-browser.mjs
  - CHROME_PATH="$CHROME_BIN" TIME_RANGE_OUTPUT="$CI_PROJECT_DIR/frontend/node_modules/.cache/time-range" node tests/timeRange-browser.mjs
  - HARDWARE_TEST_OUTPUT="$CI_PROJECT_DIR/frontend/node_modules/.cache/hardware" CHROME_PATH="$CHROME_BIN" node src/modules/servers/hardware.visual.test.mjs
  - npm run build
  - node node_modules/vitest/vitest.mjs run --config vitest.login-modal.config.mjs
  - node node_modules/vitest/vitest.mjs run --config vitest.browser-sessions.config.mjs
  - STELLA_CHROMIUM="$CHROME_BIN" STELLA_SESSION_QA_OUTPUT="$CI_PROJECT_DIR/frontend/node_modules/.cache/browser-sessions"
    node node_modules/@playwright/test/cli.js test --config playwright.browser-sessions.config.ts
  - STELLA_CHROMIUM="$CHROME_BIN" STELLA_LOGIN_QA_OUTPUT="$CI_PROJECT_DIR/frontend/node_modules/.cache/login-polish" node
    node_modules/@playwright/test/cli.js test --config playwright.login-modal.config.ts
  - STELLA_CHROMIUM="$CHROME_BIN" NOTES_ARTIFACTS="$CI_PROJECT_DIR/frontend/node_modules/.cache/notes-polish" node node_modules/@playwright/test/cli.js
    test --config e2e/notes-polish.config.ts
  - STELLA_CHROMIUM="$CHROME_BIN" STELLA_DOC_SKIP_BUILD=1 STELLA_DOC_OUTPUT="$CI_PROJECT_DIR/frontend/node_modules/.cache/documentation" npm run test:documentation
  tags:
  - stella-isolated-test
experience-gate:
  extends: .branch-validation
  stage: test
  image: gitlab-registry.xiya.live/yaoyao/stellahaven/ci-base/node@sha256:c4d5523090a817b7aa86d2111241fdd4f66d1e27782b44160e6aa63b357ecb2d
  timeout: 15m
  allow_failure: false
  variables:
    STELLA_CHROMIUM: /usr/bin/chromium
    PLAYWRIGHT_DOWNLOAD_HOST: https://npmmirror.com/mirrors/playwright
    TMPDIR: /root/stella-experience-ci-tmp
  before_script:
  - "if [ -n \"${STELLA_PRODUCTION_SSH_KEY:-}${STELLA_PRODUCTION_INVENTORY:-}${STELLA_PRODUCTION_KNOWN_HOSTS:-}${KUBECONFIG:-}${KUBE_CONFIG:-}${LOCAL_HA_SSH_CONFIG:-}${LOCAL_HA_INVENTORY:-}${STELLA_SECRET_KEY:-}${DATABASE_URL:-}\"\
    \ ]; then\n  printf '%s\\n' 'Deployment credentials must not enter validation/build jobs' >&2\n  exit 1\nfi\n"
  - mkdir -p "$TMPDIR" && chmod 700 "$TMPDIR"
  - python3 deploy/ci/runner-isolation/browser_dependencies.py experience
  script:
  - cd frontend
  - npm ci --ignore-scripts --include=dev --prefer-offline
  - node node_modules/@playwright/test/cli.js install ffmpeg
  - npm run test:experience
  - cd .. && python3 -m unittest discover -s deploy/experience-static/tests -v
  - python3 deploy/background-cache/test_real_nginx.py --evidence frontend/node_modules/.cache/experience/background-cache
  artifacts:
    when: always
    expire_in: 30 days
    paths:
    - frontend/node_modules/.cache/experience/
  tags:
  - stella-isolated-test
  cache: []
build-images:
  extends: .branch-validation
  timeout: 30m
  stage: build
  image:
    name: moby/buildkit@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
    entrypoint:
    - ''
  needs: ["backend-test", "frontend-build", "local-ha-contract", "experience-gate"]
  variables:
    REGISTRY: gitlab-registry.xiya.live/yaoyao/stellahaven
  before_script:
  - "if [ -n \"${STELLA_PRODUCTION_SSH_KEY:-}${STELLA_PRODUCTION_INVENTORY:-}${STELLA_PRODUCTION_KNOWN_HOSTS:-}${KUBECONFIG:-}${KUBE_CONFIG:-}${LOCAL_HA_SSH_CONFIG:-}${LOCAL_HA_INVENTORY:-}${STELLA_SECRET_KEY:-}${DATABASE_URL:-}\"\
    \ ]; then\n  printf '%s\\n' 'Deployment credentials must not enter validation/build jobs' >&2\n  exit 1\nfi\n"
  script:
  - sh deploy/ci/runner-isolation/build-rootless.sh
  artifacts:
    paths:
    - .ci-build-receipt/app.json
    - .ci-build-receipt/pg.json
    expire_in: 7 days
  tags:
  - stella-isolated-build
  cache: []
local-ha-production-app:
  stage: deploy
  image: gitlab-registry.xiya.live/yaoyao/stellahaven/ci-base/python@sha256:8fb4cfa1a2616d7b8e0c2175cc6ad68f5729c34ea8488c0b360d2934b7be9024
  timeout: 30m
  interruptible: false
  needs:
  - job: build-image-receipt
    artifacts: true
  resource_group: stella-production
  rules:
  - if: $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $STELLA_DEPLOY_TARGET == "local-ha" && $STELLA_RUNNER_ISOLATION_READY
      == "true"
    when: manual
    allow_failure: false
  - when: never
  environment:
    name: production
    deployment_tier: production
  before_script:
  - apt-get update && apt-get install -y --no-install-recommends openssh-client
  - test -f "$STELLA_PRODUCTION_SSH_KEY" && chmod 600 "$STELLA_PRODUCTION_SSH_KEY"
  script:
  - python3 deploy/local-ha/production_release.py --validate-pack
  - 'status=0

    python3 deploy/local-ha/production_release.py > production-release-receipt.json || status=$?

    python3 -c ''from pathlib import Path; print(Path("production-release-receipt.json").read_text(), end="")''

    exit "$status"

    '
  artifacts:
    when: always
    expire_in: 30 days
    paths:
    - production-release-receipt.json
  tags:
  - stella-isolated-deploy
  cache: []
  manual_confirmation: Deploy the separately approved immutable image after edge-first and runner-isolation acceptance?
deploy-k3s:
  timeout: 15m
  stage: deploy
  image:
    name: alpine/kubectl:1.35.0
    entrypoint:
    - ''
  needs:
  - build-images
  rules:
  - when: never
  resource_group: stella-production
  environment:
    name: production
  script:
  - test "$CI_COMMIT_BRANCH" = master && test "$CI_COMMIT_REF_PROTECTED" = true
  - test "${STELLA_DEPLOY_TARGET:-k3s}" = k3s
  - kubectl rollout status deployment/pg-nyarch -n stella --timeout=60s || true
  - kubectl set image deployment/stella-local stella=gitlab-registry.xiya.live/yaoyao/stellahaven:$CI_COMMIT_SHA -n stella
  - kubectl set image deployment/stella-us stella=gitlab-registry.xiya.live/yaoyao/stellahaven:$CI_COMMIT_SHA -n stella
  - kubectl rollout status deployment/stella-local -n stella --timeout=180s
  - kubectl rollout status deployment/stella-us -n stella --timeout=180s
  - echo "🎉 deployed $CI_COMMIT_SHA"
  tags:
  - stella-isolated-deploy
  cache: []
  before_script: []
local-ha-contract:
  extends: .branch-validation
  stage: test
  image: gitlab-registry.xiya.live/yaoyao/stellahaven/ci-base/docker@sha256:f56779b4e86550493153cc8642c9c8e40b5d934e43cb5b4ea463aea5245c5c01
  timeout: 5m
  before_script:
  - "if [ -n \"${STELLA_PRODUCTION_SSH_KEY:-}${STELLA_PRODUCTION_INVENTORY:-}${STELLA_PRODUCTION_KNOWN_HOSTS:-}${KUBECONFIG:-}${KUBE_CONFIG:-}${LOCAL_HA_SSH_CONFIG:-}${LOCAL_HA_INVENTORY:-}${STELLA_SECRET_KEY:-}${DATABASE_URL:-}\"\
    \ ]; then\n  printf '%s\\n' 'Deployment credentials must not enter validation/build jobs' >&2\n  exit 1\nfi\n"
  - ALPINE_BRANCH="v$(cut -d. -f1,2 /etc/alpine-release)"
  - apk --repositories-file /dev/null -X "https://mirrors.ustc.edu.cn/alpine/$ALPINE_BRANCH/main" -X "https://mirrors.ustc.edu.cn/alpine/$ALPINE_BRANCH/community"
    add --no-cache python3 py3-yaml
  script:
  - python3 -m unittest discover -s deploy/local-ha/tests -v
  tags:
  - stella-isolated-test
  cache: []
local-ha-live-readonly:
  stage: deploy
  image: gitlab-registry.xiya.live/yaoyao/stellahaven/ci-base/python@sha256:8fb4cfa1a2616d7b8e0c2175cc6ad68f5729c34ea8488c0b360d2934b7be9024
  timeout: 5m
  needs:
  - build-images
  rules:
  - when: never
  environment:
    name: local-ha-validation/$CI_COMMIT_REF_SLUG
    deployment_tier: testing
    action: verify
  before_script:
  - apt-get update && apt-get install -y --no-install-recommends openssh-client
  script:
  - test -n "$LOCAL_HA_INVENTORY" && test -f "$LOCAL_HA_INVENTORY"
  - test -n "$LOCAL_HA_SSH_CONFIG" && test -f "$LOCAL_HA_SSH_CONFIG"
  - python3 deploy/local-ha/validate_live.py --inventory "$LOCAL_HA_INVENTORY" --ssh-config "$LOCAL_HA_SSH_CONFIG" --image
    "$LOCAL_HA_APP_IMAGE"
  tags:
  - stella-isolated-deploy
  cache: []
local-ha-preview:
  stage: deploy
  image: gitlab-registry.xiya.live/yaoyao/stellahaven/ci-base/docker@sha256:f56779b4e86550493153cc8642c9c8e40b5d934e43cb5b4ea463aea5245c5c01
  timeout: 15m
  interruptible: false
  needs:
  - build-images
  resource_group: stella-ha-preview
  variables:
    STELLA_DEPLOY_TARGET: local-ha-preview
  rules:
  - when: never
  environment:
    name: local-ha-preview
    deployment_tier: testing
  before_script:
  - ALPINE_BRANCH="v$(cut -d. -f1,2 /etc/alpine-release)"
  - apk --repositories-file /dev/null -X "https://mirrors.ustc.edu.cn/alpine/$ALPINE_BRANCH/main" -X "https://mirrors.ustc.edu.cn/alpine/$ALPINE_BRANCH/community"
    add --no-cache python3
  - echo "$CI_REGISTRY_PASSWORD" | docker login gitlab-registry.xiya.live -u "$CI_REGISTRY_USER" --password-stdin
  script:
  - test "$CI_COMMIT_BRANCH" = feature/local-ha-20260915
  - test "$STELLA_DEPLOY_TARGET" = local-ha-preview
  - 'status=0

    python3 deploy/local-ha/preview_release.py --commit "$CI_COMMIT_SHA" --fixture "${LOCAL_HA_PREVIEW_FIXTURE:-}" > preview-receipt.json
    || status=$?

    python3 -c ''from pathlib import Path; print(Path("preview-receipt.json").read_text(), end="")''

    exit "$status"

    '
  artifacts:
    when: always
    expire_in: 30 days
    paths:
    - preview-receipt.json
  tags:
  - stella-isolated-deploy
  cache: []
build-image-receipt:
  extends: .branch-validation
  stage: build
  timeout: 2m
  tags:
  - stella-isolated-test
  cache: []
  image: gitlab-registry.xiya.live/yaoyao/stellahaven/ci-base/python@sha256:25e2514972115ba1714069a3facf805a8ec789bf9f896c959465dc8df6501651
  needs:
  - job: build-images
    artifacts: true
  before_script:
  - "if [ -n \"${STELLA_PRODUCTION_SSH_KEY:-}${STELLA_PRODUCTION_INVENTORY:-}${STELLA_PRODUCTION_KNOWN_HOSTS:-}${KUBECONFIG:-}${KUBE_CONFIG:-}${LOCAL_HA_SSH_CONFIG:-}${LOCAL_HA_INVENTORY:-}${STELLA_SECRET_KEY:-}${DATABASE_URL:-}\"\
    \ ]; then\n  printf '%s\\n' 'Deployment credentials must not enter validation/build jobs' >&2\n  exit 1\nfi\n"
  script:
  - python3 deploy/ci/runner-isolation/image_receipt.py
  artifacts:
    reports:
      dotenv: production-image.env
    paths:
    - production-image.env
    expire_in: 7 days
